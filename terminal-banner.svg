<svg width="100%" viewBox="0 0 900 210" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Prathi's terminal boot sequence</title>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#140a2e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="210" rx="12" fill="url(#bg-grad)" stroke="#3b1e7a" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="0" y="0" width="900" height="30" rx="12" fill="#12122a"/>
  <rect x="0" y="18" width="900" height="12" fill="#12122a"/>
  <circle cx="20" cy="15" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="15" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="15" r="5" fill="#27c93f"/>
  <text x="450" y="19" fill="#8a8aa8" font-family="Consolas, monospace" font-size="12" text-anchor="middle">prathi@itsprathi: ~</text>

  <!-- terminal text, typed in sequence -->
  <g font-family="Consolas, 'Fira Code', monospace" font-size="15" fill="#00f0ff">
    <text x="24" y="58">
      <tspan fill="#7f5af0">prathi@linux</tspan><tspan fill="#e6e6f0">:~$ </tspan>whoami
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    </text>
    <text x="24" y="84" fill="#e6e6f0" opacity="0">
      &gt; Pratheesh Kumar G (aka Prathi) — Java &amp; Android Developer
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.1s" fill="freeze"/>
    </text>
    <text x="24" y="110" opacity="0">
      <tspan fill="#7f5af0">prathi@linux</tspan><tspan fill="#e6e6f0">:~$ </tspan>cat ~/currently.log
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.0s" fill="freeze"/>
    </text>
    <text x="24" y="136" fill="#e6e6f0" opacity="0">
      &gt; training: Java Full-Stack @ QSpiders | os: Linux | anime: Black Clover
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.9s" fill="freeze"/>
    </text>
    <text x="24" y="162" opacity="0">
      <tspan fill="#7f5af0">prathi@linux</tspan><tspan fill="#e6e6f0">:~$ </tspan>echo "insert coin"
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.8s" fill="freeze"/>
    </text>
    <text x="24" y="188" fill="#fcd34d" opacity="0" filter="url(#glow)">
      &gt; ⚡ Player One Ready ⚡
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="4.7s" fill="freeze"/>
    </text>
  </g>

  <!-- blinking cursor -->
  <rect x="24" y="198" width="10" height="14" fill="#00f0ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="5.2s" repeatCount="indefinite"/>
  </rect>
</svg>
